    * {
      box-sizing: border-box;

      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    body {
      background: #0d0f12;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Top Header */
    .app-header {
      width: 100%;
      background: rgba(22, 27, 34, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .back-nav-btn {
      background: rgba(255, 255, 255, 0.05);
      color: #00e676;
      border: 1px solid rgba(0, 230, 118, 0.3);

      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .badge {

      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
    }

    .main-content {
      padding: 20px 16px;
      width: 100%;
      max-width: 420px;
    }

    /* Total Banner */
    .total-card {
      background: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .total-info span {
      font-size: 0.8rem;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .total-info strong {
      font-size: 1.8rem;
      color: #00e676;
      display: block;
      margin-top: 2px;
      font-weight: 700;
    }

    .reset-btn {
      background: rgba(255, 61, 0, 0.15);
      color: #ff5252;
      border: 1px solid rgba(255, 61, 0, 0.3);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .section-title {
      font-size: 1.1rem;
      color: #ffffff;
      margin-bottom: 16px;
      font-weight: 700;
    }

    /* Individual Ad Cards */
    .ad-card {
      background: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .ad-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .ad-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
    }

    .ad-key {
      font-size: 0.7rem;
      font-family: monospace;
      color: #00e676;
      background: rgba(0, 230, 118, 0.1);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(0, 230, 118, 0.2);
    }

    .ad-desc {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    /* Buttons */
    .video-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-ad1 {
      background: #ff9100;
      color: #121212;
    }

    .btn-ad2 {
      background: #00b0ff;
      color: #121212;
    }

    .video-btn:disabled {
      background: #2a313d !important;
      color: #6b7280 !important;
      cursor: not-allowed;
    }

    /* Status Box */
    .status-box {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.82rem;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>
